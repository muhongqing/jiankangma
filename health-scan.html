<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>健康证扫码查询</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui;padding:20px;max-width:500px;margin:0 auto;background:#f5f5f5}
  .title{text-align:center;margin:20px 0;font-size:20px}
  #video{width:100%;border-radius:12px;background:#000}
  #result{background:white;padding:20px;border-radius:12px;margin-top:16px;display:none}
  .avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:10px}
  .info p{margin:6px 0;font-size:15px}
  .tip{color:#666;text-align:center;margin:10px 0}
</style>
</head>

<body>
<div class="title">健康证扫码查询</div>
<video id="video" autoplay playsinline></video>
<div class="tip">请将二维码对准框内</div>
<div id="result"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// ===================== 填写你的4个参数 =====================
const APP_ID = '你的AppID';
const APP_SECRET = '你的AppSecret';
const APP_TOKEN = '多维表格app_token';
const TABLE_ID = '数据表table_id';
// ==========================================================

const video = document.getElementById('video');
const result = document.getElementById('result');
let scanning = true;

// 1. 启动摄像头扫码
async function startScan() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => video.play();
    requestAnimationFrame(scanLoop);
  } catch (err) {
    alert('摄像头授权失败，请允许权限');
  }
}

// 2. 循环扫码
function scanLoop() {
  if (!scanning) return;
  const canvas = document.createElement('canvas');
  const w = video.videoWidth, h = video.videoHeight;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);
  const image = ctx.getImageData(0, 0, w, h);
  const code = jsQR(image.data, w, h);

  if (code && code.data) {
    scanning = false;
    video.srcObject.getTracks().forEach(t => t.stop());
    queryByCardId(code.data.trim());
  } else {
    requestAnimationFrame(scanLoop);
  }
}

// 3. 获取飞书token
async function getToken() {
  const res = await fetch('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' }
  });
  const d = await res.json();
  return d.access_token;
}

// 4. 按健康证号查询
async function queryByCardId(cardId) {
  result.innerHTML = '查询中...';
  result.style.display = 'block';
  try {
    const token = await getToken();
    const url = `https://open.feishu.cn/open-apis/bitable/v1/apps/${APP_TOKEN}/tables/${TABLE_ID}/records`;
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        filter: {
          conjunction: 'and',
          conditions: [{ field_name: '健康证号', operator: 'is', value: cardId }]
        }
      })
    });
    const data = await res.json();
    if (data.code !== 0) {
      result.innerHTML = '查询错误：' + data.msg;
      return;
    }
    if (!data.data.items.length) {
      result.innerHTML = '未找到该健康证信息';
      return;
    }
    showData(data.data.items[0].fields);
  } catch (e) {
    result.innerHTML = '网络异常，请重试';
  }
}

// 5. 展示结果
function showData(fields) {
  result.innerHTML = `
    <div style="text-align:center">
      <img src="${fields.头像URL || ''}" class="avatar" onerror="this.style.display='none'">
    </div>
    <div class="info">
      <p>姓名：${fields.姓名 || '-'}</p>
      <p>性别：${fields.性别 || '-'}</p>
      <p>单位：${fields.单位 || '-'}</p>
      <p>有效期：${fields.有效期 || '-'}</p>
    </div>
    <div style="text-align:center;margin-top:16px">
      <button onclick="window.location.reload()" style="padding:8px 16px">重新扫码</button>
    </div>
  `;
}

startScan();
</script>
</body>
</html>
